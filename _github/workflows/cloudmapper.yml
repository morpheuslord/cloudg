name: CloudMapper CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security scan (every Monday at 6:00 UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'
  OUTPUT_DIR: './reports'

jobs:
  # ── Lint & Type Check ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check cloudmapper/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check cloudmapper/ tests/

  # ── Unit Tests ──
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  # ── Security Scan (scheduled & main branch) ──
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run CloudMapper
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          cloudmapper run --provider aws -o ${{ env.OUTPUT_DIR }}
        continue-on-error: true

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudmapper-report
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 30

  # ── IaC Scan on PR ──
  iac-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on changed IaC files
        run: |
          checkov -d . --output json --quiet > checkov-results.json || true


      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: checkov-results.json

  # ── Docker Build ──
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t cloudmapper:latest .

      - name: Test Docker image
        run: |
          docker run --rm cloudmapper:latest --version
