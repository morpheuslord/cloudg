# MkDocs Material configuration for https://morpheuslord.github.io/cloudg/
#
# Hand-written pages live in site/content/. The reference pages (CLI options,
# config.yaml, the changelog and the long docs/*.md references) are generated
# at build time by site/hooks.py and are never committed. site/AUTHORING.md
# explains how to write a page.
#
#   .venv/bin/mkdocs serve -a 127.0.0.1:8807    # live preview
#   .venv/bin/mkdocs build --strict             # what CI runs

site_name: cloudg
site_url: https://morpheuslord.github.io/cloudg/
site_description: >-
  cloudg (cloud graphing) maps AWS, Azure and GCP infrastructure into a graph,
  runs security scanners over the same inventory and merges every finding
  into one deduplicated, compliance-mapped result.
site_author: morpheuslord

repo_url: https://github.com/morpheuslord/cloudg
repo_name: morpheuslord/cloudg
edit_uri: edit/main/site/content/

docs_dir: site/content
site_dir: site/dist

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

watch:
  - site/hooks.py
  - site/gen
  - site/overrides
  - site/static
  - docs
  - cloudg
  - CHANGELOG.md
  - config.yaml

hooks:
  - site/hooks.py

nav:
  - Home: index.md
  - Guides:
      - Start:
          - Introduction: guides/introduction.md
          - Installation: guides/installation.md
          - Quickstart: guides/quickstart.md
          - The pipeline: guides/pipeline.md
      - Mapping:
          - Inventory mapping: guides/inventory-mapping.md
          - Dependencies and blast radius: guides/dependencies.md
          - AWS Organizations: guides/aws-organizations.md
      - Scanning:
          - Running scanners: guides/running-scanners.md
          - Ingesting existing output: guides/ingesting.md
          - Compliance frameworks: guides/compliance.md
      - Analyse:
          - Graph, ontology and RAG: guides/graph-ontology-rag.md
          - Reports: guides/reports.md
          - Sample report: sample-report.md
      - Operate:
          - Authentication: guides/authentication.md
          - Rate limits and throttling: guides/rate-limits.md
          - Docker: guides/docker.md
          - CI and automation: guides/ci-automation.md
          - Python recipes: guides/python-recipes.md
  - Examples:
      - examples/index.md
      - Map and query: examples/map-and-query.md
      - Ingest and report: examples/ingest-and-report.md
      - Graph, ontology and RAG: examples/graph-and-exports.md
      - Errors and strict mode: examples/errors.md
  - CLI:
      - cli/index.md
      - Pipeline:
          - cloudg run: cli/run.md
          - cloudg collect: cli/collect.md
          - cloudg scan: cli/scan.md
          - cloudg report: cli/report.md
      - Inventory:
          - cloudg map: cli/map.md
          - cloudg deps: cli/deps.md
          - cloudg ingest: cli/ingest.md
      - MCP:
          - cloudg mcp serve: cli/mcp-serve.md
          - cloudg mcp config: cli/mcp-config.md
          - cloudg mcp tools: cli/mcp-tools.md
          - cloudg mcp resources: cli/mcp-resources.md
          - cloudg mcp prompts: cli/mcp-prompts.md
          - cloudg mcp call: cli/mcp-call.md
          - cloudg mcp read: cli/mcp-read.md
      - Shared:
          - Provider and region flags: cli/provider-flags.md
          - Auth flags: cli/auth-flags.md
          - Output flags: cli/output-flags.md
  - Python API:
      - api/index.md
      - Engine:
          - CloudGEngine: api/cloudgengine.md
          - CloudGConfig: api/cloudgconfig.md
          - Result objects: api/results.md
          - Event hooks: api/event-hooks.md
          - Exceptions: api/exceptions.md
      - Inventory:
          - InventoryMapper: api/inventorymapper.md
          - InventoryResult: api/inventoryresult.md
          - RelationshipLinker: api/relationshiplinker.md
          - DependencyGraph: api/dependencygraph.md
      - Graph:
          - GraphBuilder: api/graphbuilder.md
          - ReachabilityAnalyzer: api/reachabilityanalyzer.md
          - CloudOntology: api/cloudontology.md
          - RAGExporter: api/ragexporter.md
      - Findings:
          - FindingsNormaliser: api/findingsnormaliser.md
          - parse_report: api/parse-report.md
          - Data models: api/models.md
      - Extend:
          - Entry points: api/entry-points.md
          - cloudg.resilience: api/resilience.md
          - CloudGMCPLayer: api/mcp-layer.md
  - MCP server:
      - mcp/index.md
      - Connect a client: mcp/connect.md
      # docs/*.md entries are split into one page per section by site/hooks.py
      - Server: docs/MCP.md
      - Tools: docs/MCP_TOOLS.md
      - Privacy and policy: docs/MCP_PRIVACY.md
      - Internals: docs/MCP_INTERNALS.md
  - Reference:
      # one page per top-level section of config.yaml, generated by site/hooks.py
      - config.yaml: config.yaml
      - Outputs:
          - Output files: reference/output-files.md
      - Inventory structures: docs/INVENTORY_REFERENCE.md
      - Catalogs: docs/INVENTORY_CATALOG.md
      - Inventory internals: docs/INVENTORY_INTERNALS.md
      - Resilience internals: docs/RESILIENCE.md
  - About:
      - Changelog: changelog.md
      - Credits: credits.md

theme:
  name: material
  # The release banner on every page (site/overrides/main.html; bump it with the version)
  custom_dir: site/overrides
  logo: assets/images/logo-mark.svg
  favicon: assets/images/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    # Dark by default: it is a security tool.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - content.action.edit
    - toc.follow

plugins:
  - search
  - redirects:
      redirect_maps:
        # folder addresses that never had a page of their own
        guides/index.md: guides/introduction.md
        reference/index.md: reference/config/providers.md
        reference/config/index.md: reference/config/providers.md
        about/index.md: changelog.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            extensions:
              - site/gen/griffe_rst.py:RstToMarkdown
            docstring_style: google
            docstring_options:
              # cloudg's "Returns:" sections are prose that wraps at the same
              # indent, not one "type: description" item per line
              returns_multiple_items: false
            docstring_section_style: table
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_root_members_full_path: false
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            show_source: true
            show_bases: true
            show_labels: true
            members_order: source
            filters: ["!^_"]
            heading_level: 3
            line_length: 88

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [site/examples, .]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/morpheuslord/cloudg
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cloudg/
    - icon: fontawesome/brands/docker
      link: https://github.com/morpheuslord/cloudg/pkgs/container/cloudg

# copyright and extra.release are set by site/hooks.py from CHANGELOG.md
