name: CloudG CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security scan (every Monday at 6:00 UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'
  OUTPUT_DIR: './reports'

jobs:
  # ── Lint & Type Check ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[all,dev]"

      - name: Run Ruff linter
        run: ruff check cloudg/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check cloudg/ tests/

  # ── Unit Tests ──
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[all,dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  # ── GitHub Action self-test (no cloud access) ──
  action:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Report only
        id: report
        uses: ./
        with:
          provider: aws
          findings: tests/fixtures/ci/findings.json
          fail-on: never
          upload-sarif: "false"
          artifact-name: cloudg-action-selftest
          retention-days: "1"

      - name: Gate on critical
        id: gate
        continue-on-error: true
        uses: ./
        with:
          provider: aws
          findings: tests/fixtures/ci/findings.json
          output: gated
          fail-on: critical
          upload-sarif: "false"
          upload-artifact: "false"

      - name: Check the outputs
        env:
          REPORT_PASSED: ${{ steps.report.outputs.passed }}
          REPORT_TOTAL: ${{ steps.report.outputs.total-findings }}
          SARIF_FILE: ${{ steps.report.outputs.sarif-file }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_BLOCKING: ${{ steps.gate.outputs.blocking }}
        run: |
          set -eux
          test "$REPORT_PASSED" = true
          test "$REPORT_TOTAL" = 3
          python3 - "$SARIF_FILE" <<'EOF'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["version"] == "2.1.0", doc["version"]
          assert len(doc["runs"][0]["results"]) == 4  # the suppressed one is kept, marked
          EOF
          test "$GATE_OUTCOME" = failure
          test "$GATE_BLOCKING" = 1

  # ── Security Scan (scheduled & main branch) ──
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[all,dev]"

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run CloudG
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          cloudg run --provider aws -o ${{ env.OUTPUT_DIR }}
        continue-on-error: true

      - name: Upload report artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cloudg-report
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 30

  # ── IaC Scan on PR ──
  iac-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-dependency-glob: pyproject.toml

      - name: Install Checkov
        run: uv pip install --system checkov

      - name: Run Checkov on changed IaC files
        run: |
          checkov -d . --output json --quiet > checkov-results.json || true


      - name: Upload Checkov results
        uses: actions/upload-artifact@v7
        with:
          name: checkov-results
          path: checkov-results.json

  # ── Docker Build ──
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        run: |
          docker build -t cloudg:latest .

      - name: Test Docker image
        run: |
          docker run --rm cloudg:latest --version
