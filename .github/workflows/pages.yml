name: Docs

# Builds the documentation site (MkDocs Material, mkdocs.yml) and deploys it to
# GitHub Pages on every push to main that touches the docs, the content they are
# generated from (click commands, docstrings, config.yaml, CHANGELOG.md) or the
# site itself. The site is served at https://morpheuslord.github.io/cloudg/.
#
# One-time setup: under Settings -> Pages, set "Build and deployment"
# source to "GitHub Actions". The GITHUB_TOKEN cannot create the Pages
# site itself (that needs admin rights), so the workflow fails with
# "Resource not accessible" until the source is set once by hand.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "cloudg/**"
      - "config.yaml"
      - "CHANGELOG.md"
      - "README.md"
      - "pyproject.toml"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so source links point at the release tag

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The CLI, config and API reference pages are generated from the code,
      # so cloudg is installed next to the docs dependency group. pip reads
      # dependency groups from 25.1 on.
      - name: Install cloudg and the docs tools
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install . --group docs

      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist/
          # The artifact name carries the run attempt: on a re-run, the previous
          # attempt's "github-pages" artifact still exists in the run, and
          # deploy-pages refuses when it finds two artifacts with the same name.
          name: github-pages-${{ github.run_attempt }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # nosemgrep: codacy.yaml.security.hard-coded-tokens -- OIDC permission scope, not a token value
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
