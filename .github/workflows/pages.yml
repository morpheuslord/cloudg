name: Docs

# Deploys docs/ to GitHub Pages on every push to main that touches it.
#
# One-time setup: under Settings -> Pages, set "Build and deployment"
# source to "GitHub Actions". The GITHUB_TOKEN cannot create the Pages
# site itself (that needs admin rights), so the workflow fails with
# "Resource not accessible" until the source is set once by hand.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # nosemgrep: codacy.yaml.security.hard-coded-tokens -- OIDC permission scope, not a token value
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
