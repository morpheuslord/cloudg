name: Docs

# Builds the documentation site (site/build.py) and deploys it to GitHub Pages
# on every push to main that touches the docs, the content they are generated
# from (click commands, docstrings, config.yaml, CHANGELOG.md) or the site itself.
#
# One-time setup: under Settings -> Pages, set "Build and deployment"
# source to "GitHub Actions". The GITHUB_TOKEN cannot create the Pages
# site itself (that needs admin rights), so the workflow fails with
# "Resource not accessible" until the source is set once by hand.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "cloudg/**"
      - "config.yaml"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so source links point at the release tag

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The CLI and API reference pages are generated by importing cloudg,
      # so the package is installed; its core dependencies already include
      # everything the site generator needs (markdown-it-py, Pygments, Jinja2).
      - name: Install cloudg
        run: pip install .

      - name: Build the site
        run: python site/build.py --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist/
          # The artifact name carries the run attempt: on a re-run, the previous
          # attempt's "github-pages" artifact still exists in the run, and
          # deploy-pages refuses when it finds two artifacts with the same name.
          name: github-pages-${{ github.run_attempt }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # nosemgrep: codacy.yaml.security.hard-coded-tokens -- OIDC permission scope, not a token value
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
