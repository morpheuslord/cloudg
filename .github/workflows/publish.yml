name: Publish

# Runs when a GitHub release is published, or manually from the Actions tab.
# Publishes the Python package to PyPI (trusted publishing / OIDC — no API
# token secret needed, but the publisher must be registered once on PyPI,
# see notes at the bottom) and the Docker image to GitHub Container Registry.

on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege default for every job; the publish and docker jobs declare
# the extra scopes they need themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set version from release tag
        # The release tag is the source of truth: v0.4.0 builds 0.4.0
        # no matter what pyproject.toml says, so a stale version can
        # never collide with a file already on PyPI.
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" cloudg/__init__.py
          echo "Building version $VERSION from tag $GITHUB_REF_NAME"

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/cloudg-*.whl
          /tmp/smoke/bin/python -c "import cloudg; print('cloudg', cloudg.__version__)"
          /tmp/smoke/bin/cloudg --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of an already-published release stays green instead
          # of failing on the duplicate file.
          skip-existing: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GitHub Container Registry
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image version tag
        id: version
        # v0.3.1 -> 0.3.1; manual runs from a branch tag as that branch name
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/morpheuslord/cloudg:latest
            ghcr.io/morpheuslord/cloudg:${{ steps.version.outputs.version }}

# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Project name:  cloudg
#   Owner:         morpheuslord
#   Repository:    cloudg
#   Workflow:      publish.yml
#   Environment:   pypi
# Also create the "pypi" environment under the repo's Settings -> Environments.
