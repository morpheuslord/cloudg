# ARN -> AssetType classification for AWS breadth-sweep hits
# (cloudg.inventory.aws_deep.asset_type_from_arn).
#
# Keys are "<service>:<resource-type>" or a bare "<service>" fallback. The
# resource type is the first segment of the ARN resource part, except:
# wafv2 uses the segment after the scope (regional/webacl/... -> webacl),
# apigateway uses the path (/restapis/x -> restapis, /restapis/x/stages/y ->
# restapis/stages), and the bare "s3" entry only matches bucket ARNs
# (arn:aws:s3:::name), never access points or other S3 resources. Values are
# cloudg AssetType names. Extra YAML files with an "arn_types" key in
# $CLOUDG_CATALOG_DIR are merged on top.

arn_types:
  "ec2:instance": EC2
  "ec2:volume": EBS_VOLUME
  "ec2:vpc": VPC
  "ec2:subnet": SUBNET
  "ec2:security-group": SECURITY_GROUP
