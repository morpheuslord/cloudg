# Cloud Control breadth sweep reference (cloudg.inventory.aws_services.cloudcontrol).
#
# Grow this file instead of editing code:
#   covered_types   CloudFormation types a dedicated deep collector already maps in
#                   detail; the sweep skips them. Add a type here when you add a
#                   collector for it.
#   global_prefixes Types listed once per account, in the primary region only.
#   asset_types     CloudFormation type -> cloudg AssetType name for sweep hits.
#                   Unlisted types fall back to the ARN classifier, then OTHER.
#   sensitive_fields Top-level properties dropped for a type (secret-bearing values).
#                   Keys matching the generic secret pattern are always dropped.
#
# Extra YAML files with the same keys in $CLOUDG_CATALOG_DIR are merged on top.

