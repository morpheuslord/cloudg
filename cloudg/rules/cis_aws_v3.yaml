# ─────────────────────────────────────────────────────────────────
# CIS AWS Foundations Benchmark v3.0 — Control ID Mappings
# Source: CIS AWS Foundations Benchmark v3.0 (public)
#
# These mappings are used to tag findings from scanners that
# don't emit their own compliance control IDs.
# Prowler, Checkov etc. already emit these natively — this file
# is the FALLBACK for untagged findings only.
# ─────────────────────────────────────────────────────────────────

framework: CIS-AWS
version: "3.0"
source: "CIS AWS Foundations Benchmark v3.0.0"

controls:
  # 1. Identity and Access Management
  - id: "CIS-1.4"
    title: "Ensure access keys are rotated every 90 days or less"
    patterns:
      - "access.*key.*rotat"
      - "access.*key.*age"
    severity: MEDIUM

  - id: "CIS-1.5"
    title: "Ensure MFA is enabled for the root user"
    patterns:
      - "root.*mfa"
      - "root.*multi.factor"
    severity: CRITICAL

  - id: "CIS-1.7"
    title: "Eliminate use of the root user for administrative tasks"
    patterns:
      - "root.*used"
      - "root.*login"
      - "root.*activity"
    severity: HIGH

  - id: "CIS-1.8"
    title: "Ensure IAM password policy requires minimum length"
    patterns:
      - "password.*policy"
      - "password.*length"
    severity: MEDIUM

  - id: "CIS-1.10"
    title: "Ensure MFA is enabled for all IAM users with console access"
    patterns:
      - "iam.*mfa"
      - "console.*mfa"
    severity: HIGH

  - id: "CIS-1.16"
    title: "Ensure IAM policies are attached only to groups or roles"
    patterns:
      - "iam.*policy.*user"
      - "policy.*direct.*attach"
    severity: MEDIUM

  # 2. Storage
  - id: "CIS-2.1.1"
    title: "Ensure S3 bucket has server-side encryption enabled"
    patterns:
      - "s3.*encrypt"
      - "bucket.*encrypt"
    severity: HIGH

  - id: "CIS-2.1.2"
    title: "Ensure S3 bucket policy does not grant public access"
    patterns:
      - "s3.*public"
      - "bucket.*public"
    severity: CRITICAL

  - id: "CIS-2.2.1"
    title: "Ensure EBS volume encryption is enabled by default"
    patterns:
      - "ebs.*encrypt"
      - "volume.*encrypt"
    severity: MEDIUM

  - id: "CIS-2.3.1"
    title: "Ensure RDS instances have encryption at rest enabled"
    patterns:
      - "rds.*encrypt"
      - "database.*encrypt"
    severity: HIGH

  # 3. Logging
  - id: "CIS-3.1"
    title: "Ensure CloudTrail is enabled in all regions"
    patterns:
      - "cloudtrail.*enable"
      - "cloudtrail.*multi.*region"
    severity: HIGH

  - id: "CIS-3.4"
    title: "Ensure CloudTrail log file validation is enabled"
    patterns:
      - "cloudtrail.*log.*valid"
      - "log.*file.*integrit"
    severity: MEDIUM

  - id: "CIS-3.9"
    title: "Ensure VPC flow logging is enabled in all VPCs"
    patterns:
      - "flow.*log"
      - "vpc.*logging"
    severity: MEDIUM

  # 4. Monitoring
  - id: "CIS-4.3"
    title: "Ensure a log metric filter and alarm exist for root account usage"
    patterns:
      - "root.*alarm"
      - "root.*monitor"
    severity: HIGH

  # 5. Networking
  - id: "CIS-5.1"
    title: "Ensure no Network ACLs allow ingress from 0.0.0.0/0"
    patterns:
      - "nacl.*0\\.0\\.0\\.0"
      - "acl.*ingress.*open"
    severity: HIGH

  - id: "CIS-5.2"
    title: "Ensure no security groups allow ingress from 0.0.0.0/0 to port 22"
    patterns:
      - "ssh.*0\\.0\\.0\\.0"
      - "port.*22.*internet"
      - "security.*group.*ssh.*open"
    severity: CRITICAL

  - id: "CIS-5.3"
    title: "Ensure no security groups allow ingress from 0.0.0.0/0 to port 3389"
    patterns:
      - "rdp.*0\\.0\\.0\\.0"
      - "port.*3389.*internet"
      - "security.*group.*rdp.*open"
    severity: CRITICAL

  - id: "CIS-5.4"
    title: "Ensure the default security group restricts all traffic"
    patterns:
      - "default.*security.*group"
      - "default.*sg.*allow"
    severity: MEDIUM
