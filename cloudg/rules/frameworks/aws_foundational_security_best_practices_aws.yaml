- id: S3.12
  title: This control checks whether Amazon S3 buckets provide user permissions via
    ACLs. The control fails if ACLs are configured for managing user access on S3
    buckets.
  checks:
  - s3_bucket_acl_prohibited
- id: S3.13
  title: This control checks if a lifecycle policy is configured for an Amazon S3
    bucket. This control fails if a lifecycle policy is not configured for an S3 bucket.
  checks:
  - s3_bucket_lifecycle_enabled
- id: S3.14
  title: This control checks whether an Amazon S3 general purpose bucket has versioning
    enabled. The control fails if versioning is suspended for the bucket.
  checks:
  - s3_bucket_object_versioning
- id: S3.15
  title: This control checks whether an Amazon S3 general purpose bucket has Object
    Lock enabled. The control fails if Object Lock isn't enabled for the bucket. If
    you provide a custom value for the mode parameter, the control passes only if
    S3 Object Lock uses the specified retention mode.
  checks:
  - s3_bucket_object_lock
- id: S3.17
  title: This control checks whether an Amazon S3 general purpose bucket is encrypted
    with an AWS KMS key (SSE-KMS or DSSE-KMS). The control fails if the bucket is
    encrypted with default encryption (SSE-S3).
  checks:
  - s3_bucket_kms_encryption
- id: S3.19
  title: This control checks whether an Amazon S3 access point has block public access
    settings enabled. The control fails if block public access settings aren't enabled
    for the access point.
  checks:
  - s3_access_point_public_access_block
- id: S3.20
  title: This control checks whether multi-factor authentication (MFA) delete is enabled
    on an Amazon S3 general purpose versioned bucket. The control fails if MFA delete
    is not enabled on the bucket. The control doesn't produce findings for buckets
    that have a Lifecycle configuration.
  checks:
  - s3_bucket_no_mfa_delete
- id: SNS.1
  title: This control checks whether an SNS topic is encrypted at rest using AWS KMS.
  checks:
  - sns_topics_kms_encryption_at_rest_enabled
- id: SQS.1
  title: This control checks whether Amazon SQS queues are encrypted at rest.
  checks:
  - sqs_queues_server_side_encryption_enabled
- id: SSM.1
  title: This control checks whether the EC2 instances in your account are managed
    by AWS Systems Manager. Systems Manager is an AWS service that you can use to
    view and control your AWS infrastructure. To help you to maintain security and
    compliance, Systems Manager scans your managed instances. A managed …
  checks:
  - ec2_instance_managed_by_ssm
- id: SSM.2
  title: This control checks whether the compliance status of the Amazon EC2 Systems
    Manager patch compliance is COMPLIANT or non compliant after the patch installation
    on the instance. It only checks instances that are managed by Systems Manager
    Patch Manager.
  checks:
  - ssm_managed_compliant_patching
- id: SSM.3
  title: This control checks whether the status of the AWS Systems Manager association
    compliance is COMPLIANT or non compliant after the association is run on an instance.
    The control passes if the association compliance status is COMPLIANT.
  checks:
  - ssm_managed_compliant_patching
- id: SSM.4
  title: This control checks whether AWS Systems Manager documents that are owned
    by the account are public. This control fails if SSM documents with the owner
    Self are public.
  checks:
  - ssm_documents_set_as_public
- id: SageMaker.1
  title: This control checks whether direct internet access is disabled for an SageMaker
    notebook instance. To do this, it checks whether the DirectInternetAccess field
    is disabled for the notebook instance. If you configure your SageMaker instance
    without a VPC, then by default direct internet access is en…
  checks:
  - sagemaker_notebook_instance_without_direct_internet_access_configured
- id: SageMaker.2
  title: This control checks if an Amazon SageMaker notebook instance is launched
    within a custom virtual private cloud (VPC). This control fails if a SageMaker
    notebook instance is not launched within a custom VPC or if it is launched in
    the SageMaker service VPC.
  checks:
  - sagemaker_notebook_instance_vpc_settings_configured
- id: SageMaker.3
  title: This control checks whether root access is turned on for an Amazon SageMaker
    notebook instance. The control fails if root access is turned on for a SageMaker
    notebook instance.
  checks:
  - sagemaker_notebook_instance_root_access_disabled
- id: SageMaker.4
  title: This control checks whether production variants of an Amazon SageMaker AI
    endpoint have an initial instance count greater than 1. The control fails if the
    endpoint's production variants have only 1 initial instance.
  checks:
  - sagemaker_endpoint_config_prod_variant_instances
- id: SageMaker.5
  title: This control checks whether an Amazon SageMaker AI hosted model blocks inbound
    network traffic. The control fails if the EnableNetworkIsolation parameter for
    the hosted model is set to False.
  checks:
  - sagemaker_models_network_isolation_enabled
- id: SecretsManager.1
  title: This control checks whether a secret stored in AWS Secrets Manager is configured
    with automatic rotation. Secrets Manager helps you improve the security posture
    of your organization. Secrets include database credentials, passwords, and third-party
    API keys. You can use Secrets Manager to store secr…
  checks:
  - secretsmanager_automatic_rotation_enabled
- id: WAF.11
  title: This control checks whether logging is activated for an AWS WAFV2 web access
    control list (web ACL). This control fails if logging is deactivated for the web
    ACL.
  checks:
  - wafv2_webacl_logging_enabled
