    for API stages. The rule is NON_COMPLIANT if log settings are not configured in
    the API Management diagnostics settings.
  checks:
  - app_http_logs_enabled
- id: 10.2.1.4.2
  title: Checks if all methods in Azure API Management (APIM) services have logging
    enabled. The rule is NON_COMPLIANT if logging is not enabled, or if the logging
    level is not set to Error or Information in the diagnostic settings.
  checks:
  - app_http_logs_enabled
- id: 10.2.1.4.3
  title: Checks if Azure API Management (APIM) services have Azure Monitor Application
    Insights (AI) tracing enabled. The rule is COMPLIANT if Application Insights integration
    is enabled for API requests, and NON_COMPLIANT otherwise.
  checks:
  - appinsights_ensure_is_configured
- id: 10.2.1.4.4
  title: Checks if an Azure API Management (APIM) service has diagnostic logging enabled.
    The rule is NON_COMPLIANT if logging is not enabled, or if the log level is neither
    Error nor Verbose (All logs).
  checks:
  - app_http_logs_enabled
- id: 10.2.1.4.6
  title: Checks if Azure Front Door or Azure CDN profiles are configured to deliver
    access logs to an Azure Storage Account or Log Analytics Workspace. The rule is
    NON_COMPLIANT if an Azure Front Door or Azure CDN profile does not have logging
    configured.
  checks:
  - monitor_storage_account_with_activity_logs_is_private
- id: 10.2.1.4.7
  title: Checks if at least one Azure Monitor Diagnostic Setting is logging Azure
    Blob Storage data events for all Storage Accounts. The rule is NON_COMPLIANT if
    there are no Diagnostic Settings configured or if no settings record Blob Storage
    data events.
  checks:
  - monitor_diagnostic_setting_with_appropriate_categories
- id: 10.2.1.4.8
  title: For this rule, the rule identifier (AZURE_ACTIVITY_LOG_ENABLED) and rule
    name (azure-activity-log-enabled) are different.
  checks:
  - monitor_alert_create_update_sqlserver_fr
- id: 10.2.1.4.15
  title: Checks if Azure App Service Environments are configured to send logs to Azure
    Monitor Logs. The rule is NON_COMPLIANT if logging is not enabled or if logs are
    not being sent to Azure Monitor Logs.
  checks:
  - app_http_logs_enabled
- id: 10.2.1.4.16
  title: Checks if Azure Load Balancer and Azure Application Gateway have logging
    enabled. The rule is NON_COMPLIANT if diagnostic logs are not enabled or if logs
    are not being sent to Azure Monitor Logs or Azure Storage Account.
  checks:
  - app_http_logs_enabled
- id: 10.2.1.4.19
  title: For this rule, the rule identifier (MULTI_REGION_AZURE_ACTIVITY_LOG_ENABLED)
    and rule name (multi-region-azure-activity-log-enabled) are different.
  checks:
  - monitor_alert_create_update_sqlserver_fr
- id: 10.2.1.4.22
  title: Checks if Azure Database for MySQL Flexible Server is configured to publish
    audit logs to Azure Monitor Logs. The rule is NON_COMPLIANT if MySQL Flexible
    Server does not have audit log publishing configured.
  checks:
  - mysql_flexible_server_audit_log_enabled
- id: 10.2.1.4.23
  title: Checks if Azure SQL Database has respective logs enabled in Azure Monitor
    Logs. The rule is NON_COMPLIANT if any required log types are not enabled.
  checks:
  - sqlserver_auditing_enabled
- id: 10.2.1.4.24
  title: Checks if Azure Synapse Analytics (formerly SQL Data Warehouse) is logging
    audits to a specific Azure Storage Account. The rule is NON_COMPLIANT if audit
    logging is not enabled for a Synapse Analytics instance or if the specified storage
    account does not match the configured audit logging destinati…
  checks:
  - sqlserver_auditing_enabled
- id: 10.2.1.4.27
  title: Checks if logging is enabled for your Azure Storage accounts. The rule is
    NON_COMPLIANT if logging is not enabled.
