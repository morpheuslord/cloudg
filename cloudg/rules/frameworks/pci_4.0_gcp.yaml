- id: 1.5.1.17
  title: In Google Cloud Platform (GCP), the equivalence for the incoming SSH policy
    that disables incoming SSH traffic can be achieved using Firewall Rules. Specifically,
    you would create a firewall rule that denies TCP traffic on port 22 (the default
    SSH port) to restrict SSH access for instances.
  checks:
  - compute_firewall_ssh_access_from_the_internet_allowed
- id: 1.5.1.18
  title: Checks if Cloud Routers are attached to an authorized Google Cloud VPC network.
    The rule is NON_COMPLIANT if Cloud Routers are attached to an unauthorized VPC
    network.
