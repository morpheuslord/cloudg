  - cloudsql_instance_mysql_skip_show_database_flag
  - cloudsql_instance_public_access
  - cloudsql_instance_sqlserver_user_options_flag
- id: 1.5.1.28
  title: Checks if the Google Cloud SQL instances are not publicly accessible. The
    rule is NON_COMPLIANT if the 'ipConfiguration' field's 'authorizedNetworks' array
