  checks:
  - cloudsql_instance_public_access
  - cloudsql_instance_public_ip
- id: A3.4.1.13
  title: Checks if Google Cloud SQL instances are not publicly accessible. The rule
    is NON_COMPLIANT if the 'publicIp' field is enabled in the instance configuration.
  checks:
  - cloudsql_instance_private_ip_assignment
  - cloudsql_instance_public_access
  - cloudsql_instance_public_ip
  - compute_instance_public_ip
- id: A3.4.1.14
  title: Checks if Google Cloud SQL backups are public. The rule is NON_COMPLIANT
    if any existing and new Google Cloud SQL backups are public.
  checks:
  - cloudsql_instance_automated_backups
  - cloudsql_instance_public_access
  - cloudsql_instance_public_ip
- id: A3.4.1.15
  title: Checks if Google BigQuery datasets are not publicly accessible. The rule
    is NON_COMPLIANT if the dataset's defaultAccessEntry has a role of 'READER' granted
    to 'allUsers'.
  checks:
  - bigquery_dataset_public_access
- id: A3.4.1.16
  title: Checks if Google Cloud Storage bucket IAM policies have public access prevention
    settings enabled. The rule is NON_COMPLIANT if public access prevention settings
    are not enabled for Google Cloud Storage buckets.
  checks:
  - bigquery_dataset_public_access
  - cloudstorage_bucket_log_retention_policy_lock
  - cloudstorage_bucket_public_access
  - cloudstorage_bucket_uniform_bucket_level_access
- id: A3.4.1.19
  title: Checks if Google Cloud Storage buckets are publicly accessible. The rule
    is NON_COMPLIANT if a Cloud Storage bucket is not listed in the excludedPublicBuckets
    parameter and the bucket's permissions settings allow public access.
  checks:
  - bigquery_dataset_public_access
  - cloudstorage_bucket_public_access
  - cloudstorage_bucket_uniform_bucket_level_access
- id: A3.4.1.21
  title: Checks if your Google Cloud Storage buckets do not allow public read access.
    The rule checks the Uniform Bucket-Level Access settings, the bucket policy, and
    the bucket access control list (ACL).
  checks:
  - cloudstorage_bucket_public_access
  - cloudstorage_bucket_uniform_bucket_level_access
- id: A3.4.1.22
  title: Checks if your Google Cloud Storage buckets do not allow public write access.
    The rule checks the Uniform bucket-level access settings, the bucket IAM policies,
    and the bucket access control list (ACL).
  checks:
  - cloudstorage_bucket_public_access
  - cloudstorage_bucket_uniform_bucket_level_access
- id: A3.4.1.25
  title: Checks if Google Cloud Compute Engine instance templates owned by the account
    are public. The rule is NON_COMPLIANT if instance templates with the owner 'Self'
    are set to allow public access.
  checks:
  - cloudsql_instance_public_access
  - cloudstorage_bucket_public_access
  - compute_instance_public_ip
- id: A3.5.1.4
  title: Checks if a Google Cloud resource type has a Google Cloud Monitoring alert
    policy for the specified metric. For resource types, you can specify Compute Engine
    instances, Cloud Storage buckets, Cloud SQL instances, or Persistent Disks. The
    rule is COMPLIANT if the specified metric has a resource ID …
  checks:
  - logging_log_metric_filter_and_alert_for_bucket_permission_changes_enabled
- id: A3.5.1.6
  title: Checks if Google Cloud Audit Logging is configured to send logs to Cloud
    Logging. The audit log configuration is NON_COMPLIANT if the log sink is not properly
    set to export logs.
  checks:
  - iam_audit_logs_enabled
  - logging_log_metric_filter_and_alert_for_audit_configuration_changes_enabled
  - logging_sink_created
