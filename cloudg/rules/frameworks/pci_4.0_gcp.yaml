  - kms_key_rotation_enabled
- id: 8.3.9.1
  title: Checks if active IAM service account keys are rotated (changed) within the
    number of days specified in maxKeyAge. The rule is NON_COMPLIANT if service account
    keys are not rotated within the specified time period. The default value is 90
    days.
