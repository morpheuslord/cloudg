- id: 1.5.1.21
  title: Checks if default ports for SSH (22) and RDP (3389) ingress traffic for Google
    Cloud Platform firewall rules is unrestricted. The rule is NON_COMPLIANT if a
    firewall rule allows ingress traffic from any source IP address on ports 22 or
    3389.
  checks:
  - compute_firewall_rdp_access_from_the_internet_allowed
  - compute_firewall_ssh_access_from_the_internet_allowed
- id: 1.5.1.27
  title: Checks if there are any Google Cloud SQL database instances that do not use
