[project]
name = "cloudg"
version = "0.5.1"
description = "cloudg (cloud graphing) - multi-cloud infrastructure mapping, knowledge graphs and security intelligence for AWS, Azure and GCP"
# The PyPI project page renders the full documentation, not the repo README
readme = "docs/DOCUMENTATION.md"
license = { text = "MIT" }
authors = [{ name = "morpheuslord", email = "chiranjeevi.naidu@proton.me" }]
requires-python = ">=3.11"
keywords = ["cloud", "security", "aws", "azure", "gcp", "graph", "ontology", "terraform", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # Core
    "pydantic>=2.0,<3.0",
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    # Graph & Ontology
    "networkx>=3.1",
    "rdflib>=7.0",
    "python-louvain>=0.16",
    # IAM Analysis
    "parliament>=1.6",
    # Visualisation
    "jinja2>=3.1",
    "svgwrite>=1.4",
    # Async
    "aiofiles>=23.0",
]

[project.urls]
Homepage = "https://github.com/morpheuslord/cloudg"
Repository = "https://github.com/morpheuslord/cloudg"
Documentation = "https://morpheuslord.github.io/cloudg/"
Changelog = "https://github.com/morpheuslord/cloudg/blob/main/CHANGELOG.md"

[project.optional-dependencies]
aws = [
    "aioboto3>=12.0",
    "boto3>=1.28",
]
azure = [
    "azure-identity>=1.14",
    "azure-mgmt-compute>=30.0",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-sql>=3.0",
    "azure-mgmt-keyvault>=10.0",
    "azure-mgmt-resourcegraph>=8.0.0",
]
gcp = [
    "google-cloud-asset>=3.0",
    "google-auth>=2.22",
]
all = [
    "cloudg[aws,azure,gcp]",
]
dev = [
    "cloudg[aws]",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "moto[all]>=5.0",
    "ruff>=0.1",
]
full = [
    "diagrams>=0.23",
    "weasyprint>=60.0",
    "policy-sentry>=0.12",
]

[project.scripts]
cloudg = "cloudg.cli:cli"

[project.entry-points."cloudg.collectors"]
aws = "cloudg.collectors.aws:AsyncAWSCollector"
azure = "cloudg.collectors.azure:AzureCollector"
gcp = "cloudg.collectors.gcp:GCPCollector"

[project.entry-points."cloudg.scanners"]
prowler = "cloudg.scanners.prowler:ProwlerScanner"
scoutsuite = "cloudg.scanners.scoutsuite:ScoutSuiteScanner"
checkov = "cloudg.scanners.checkov:CheckovScanner"
trivy = "cloudg.scanners.trivy:TrivyScanner"
iam = "cloudg.scanners.iam_linter:IAMLinter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudg"]

[tool.hatch.build.targets.sdist]
include = ["cloudg", "tests", "README.md", "docs/DOCUMENTATION.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
