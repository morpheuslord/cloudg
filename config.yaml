# ─────────────────────────────────────────────────────────────────
# CloudG Configuration File
# ─────────────────────────────────────────────────────────────────
# Copy to config.yaml and customise for your environment.

# ── Providers ──
# Specify one or more providers to scan simultaneously.
# Options: aws, azure, gcp
providers:
  - aws
  # - azure  # Uncomment to scan Azure alongside AWS
  # - gcp    # Uncomment to scan GCP alongside AWS

# ── AWS ──
aws:
  regions:
    - us-east-1
    - eu-west-1
    # - ALL              # Uncomment to auto-discover and scan ALL enabled regions

  # Auth method 1: direct credentials (useful for third-party access)
  # Can also be set via env vars: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  access_key_id: null      # Your AWS access key ID
  secret_access_key: null  # Your AWS secret access key
  session_token: null      # Optional: for temporary/STS credentials

  # Auth method 2: OIDC / web identity federation (GitHub Actions, EKS, GitLab CI)
  # Set role_arn together with web_identity_token_file.
  web_identity_token_file: null   # Path to the OIDC token file

  # Auth method 3: AWS CLI profile (plain or SSO)
  profile: null            # AWS CLI profile name (used if no direct keys)

  # Auth method 4: nothing at all; the default chain picks up env vars,
  # the EC2/ECS instance role (inherited role), or cached SSO credentials.

  # Role assumption (optional, layered on top of any method above)
  role_arn: null           # Full ARN of a role to assume via STS
  external_id: null        # ExternalId for the third-party auditor pattern
  role_session_name: cloudg-scan

  # Cross-account fan-out (optional)
  accounts: []             # Target account IDs (only if cross-account scanning)
  role_name: null          # IAM role to assume in each account

  # AWS Organizations / Control Tower discovery (`cloudg map --org`).
  # Run with management-account credentials; every selected member account
  # is mapped by assuming role_name there. AWSControlTowerExecution is admin:
  # prefer a read-only role (SecurityAudit + ViewOnlyAccess) deployed to all
  # accounts with a StackSet.
  organization:
    enabled: false
    role_name: null        # default: aws.role_name, then AWSControlTowerExecution
    include_ous: []        # OU IDs, ARNs or names (nested OUs included)
    exclude_accounts: []
    include_management_account: true
    include_suspended: false
    use_governed_regions: true   # regions [ALL] -> Control Tower governed regions
    control_tower: true    # map the landing zone, controls and baselines
    home_region: null      # Control Tower home region (auto-detected)
    map_structure: true    # org / OU / account / SCP / control nodes on the map

  max_retries: 10          # botocore retries per API call after the first attempt
  retry_mode: adaptive     # legacy | standard | adaptive (botocore client-side rate limiting)

# ── Azure ──
azure:
  subscription_ids: []     # List of subscription IDs to scan
  tenant_id: null

  # Auth methods, tried in this order:
  # 1. Workload identity federation: tenant_id + client_id + federated_token_file
  # 2. Service principal secret:      tenant_id + client_id + client_secret
  # 3. Service principal certificate: tenant_id + client_id + certificate_path
  # 4. Managed identity:              use_managed_identity: true
  # 5. DefaultAzureCredential chain (env vars, Azure CLI, managed identity)
  client_id: null
  client_secret: null
  certificate_path: null
  federated_token_file: null # nosemgrep: codacy.yaml.security.hard-coded-tokens -- config key for a file path, no token value
  use_managed_identity: false
  managed_identity_client_id: null   # For user-assigned managed identities

  # Inventory mapping (`cloudg map`): Azure Resource Graph is used when
  # azure-mgmt-resourcegraph is installed (pip install cloudg[azure]).
  all_subscriptions: true       # subscription_ids empty -> every Enabled subscription
  map_management_groups: true   # management groups, subscriptions, Azure Policy

  regions:
    - ALL                  # Auto-discover all Azure locations (default)
    # - eastus             # Or specify individual locations
    # - westeurope

# ── GCP ──
gcp:
  project_ids: []          # List of project IDs to scan
  organization_id: null

  # Auth methods, tried in this order:
  # 1. credentials_file: a service account key JSON, or a workload identity
  #    federation (external_account) config JSON
  # 2. Application default credentials (GOOGLE_APPLICATION_CREDENTIALS,
  #    gcloud user credentials, or the GCE/GKE metadata server)
  # impersonate_service_account layers impersonation on top of either.
  credentials_file: null
  impersonate_service_account: null  # e.g. scanner@my-project.iam.gserviceaccount.com

  # Inventory mapping (`cloudg map`)
  collection_scope: auto   # auto: one org-wide listing when organization_id is set
  iam_policies: true       # IAM bindings -> principal / resource access edges
  map_hierarchy: true      # organization -> folders -> projects (needs organization_id)
  org_policies: true
  vpc_service_controls: true

  regions:
    - ALL                  # Auto-discover all GCP regions (default)
    # - us-central1        # Or specify individual regions
    # - europe-west1

# ── Scanners ──
scanners:
  enabled:
    - prowler
    - scoutsuite
    - checkov
    - trivy
    - iam
  prowler_extra_args: []
  scoutsuite_extra_args: []
  checkov_extra_args: []
  checkov_frameworks: []     # Empty = auto-detect all frameworks (recommended)
    # Uncomment below to restrict to specific frameworks:
    # - terraform
    # - cloudformation
    # - arm
    # - kubernetes
  trivy_extra_args: []
  trivy_images: []
  iac_directories: []
  timeout_seconds: 3600

# ── Inventory Mapping ──
# Scanner-independent full-infrastructure mapping (`cloudg map`).
inventory:
  tagging_sweep: true      # AWS: Resource Groups Tagging API sweep (tagged resources only)
  cloud_control: true      # AWS: list every Cloud Control resource type, tagged or not
  cloud_control_types: []  # Only these CloudFormation types / prefixes (e.g. AWS::Glue::)
  cloud_control_exclude: []
  cloud_control_concurrency: 6
  link_references: true    # Derive cross-service REFERENCES edges from metadata
  services: [all]          # Families: network, compute, containers, kubernetes, serverless,
                           # integration, storage, data, identity, security, logging, dns, iac
  exclude_services: []
  kubernetes: true         # Map workloads inside EKS clusters (needs an EKS access entry)
  kubernetes_timeout: 10
  iam_resource_edges: true # Link IAM principals to the resources their policies grant
  max_images_per_repository: 20
  stack_resources: true    # Link CloudFormation stacks to the resources they manage
  account_hierarchy: true  # Account nodes containing their top-level resources

# ── Graph Engine ──
graph:
  persist_graphml: true
  max_nodes_warn: 10000
  compute_attack_paths: true
  export_cytoscape: false

# ── Ontology ──
ontology:
  enabled: true
  export_formats:
    - turtle
    - json-ld
  include_raw_metadata: false

# ── RAG Export ──
rag:
  enabled: true
  chunk_strategy: hybrid   # entity | community | relation_group | hybrid
  max_chunk_tokens: 2000 # nosemgrep: codacy.yaml.security.hard-coded-tokens -- LLM chunk size, not a token value

# ── Terraform Recreation ──
terraform:
  enabled: false
  output_dir: ./reports/terraform

# ── Reports ──
report:
  formats:
    - html
    - json
    - svg
  inline_js: true          # Bundle JS inline (no CDN) for air-gapped environments
  output_dir: ./reports

# ── External Rulesets ──
rulesets:
  # rules_dir: ./my-rules  # Override to use your own rulesets; by default the
  #                        # rulesets shipped inside the package are used
  load_external: true

# ── Cloud API throttling resilience ──
# cloudg paces every cloud API call with shared adaptive token buckets
# (per provider / account / region / service), halves a scope's rate when
# the provider throttles and recovers it gradually (AIMD), honours
# Retry-After, opens a circuit breaker on a scope that stays throttled,
# and records it in coverage ("throttled") instead of failing the map.
# Unset limits use built-in defaults at or below each provider's published
# limits (see cloudg/resilience/limiter.py for the numbers and sources).
# Where keys apply: "AWS hooks" = every boto3/aioboto3 session cloudg
# builds; "Azure policy" = every Azure SDK client cloudg builds; "GCP" =
# Cloud Asset Inventory listings. Rate, burst, breaker, adaptive and
# retry_budget keys apply to all three. Unknown keys are logged and ignored.
ratelimit:
  enabled: true
  aws:
    # max_rps: 20                  # leaf bucket per account x region x service (ec2: per action)
    # burst: 40
    # account_max_rps: null        # aggregate per account (off by default)
    # global_max_rps: null         # aggregate for all of AWS (off by default)
    # max_concurrency: 128         # in-flight HTTP requests per account (AWS hooks)
    adaptive: true                 # halve on throttle, recover additively
    # min_rps: 0.2                 # adaptive floor
    breaker_threshold: 5           # calls failing on throttling (after retries) -> open circuit
    breaker_cooldown_seconds: 60   # open circuit rejects calls this long, then probes
    retry_budget: 500              # botocore retries allowed before cloudg stops retrying
                                   # (each success refunds 0.1)
    # Not used by the AWS hooks (botocore owns per-call retries and timeouts:
    # aws.max_retries / aws.retry_mode above); only for call_with_resilience:
    # max_retries: 8
    # max_backoff_seconds: 60
    # deadline_seconds: 900
    services: {}                   # e.g. {ec2: {max_rps: 20, burst: 100}, iam: {max_rps: 5}}
  azure:
    # max_rps: 15                  # per subscription x resource provider
    # account_max_rps: 20          # per subscription (ARM: 250 burst / 25 per s)
    # account_burst: 200
    # max_concurrency: 16          # in-flight HTTP requests per subscription (Azure policy)
    max_retries: 8                 # azure-core retry_total / retry_status
    max_backoff_seconds: 60        # azure-core retry_backoff_max
    deadline_seconds: 900          # azure-core RetryPolicy timeout (whole operation)
    retry_budget: 500
    breaker_threshold: 5
    breaker_cooldown_seconds: 60
    services: {}                   # e.g. {resourcegraph: {max_rps: 3, burst: 15}}
  gcp:
    # max_rps: 10
    # max_concurrency: 16          # concurrent Cloud Asset listings per project / org
    max_retries: 8                 # consecutive api_core retries per page
    max_backoff_seconds: 60        # api_core Retry maximum
    deadline_seconds: 900          # api_core Retry timeout
    retry_budget: 500
    breaker_threshold: 5
    breaker_cooldown_seconds: 60
    services: {}                   # e.g. {cloudasset.ListAssets: {max_rps: 1.5, burst: 10}}
  # Guard rails for live collections triggered on demand (MCP / agents)
  live_cooldown_seconds: 120       # min time between live collections of one scope
  live_max_concurrent: 1           # concurrent live collections per scope
  live_max_concurrent_total: 2     # concurrent live collections overall
  live_caller_max_operations: 0    # per caller per window (0 = unlimited)
  live_caller_window_seconds: 3600

# ── General ──
log_file: null             # null = console only; set path for file logging
verbose: false
concurrency_limit: 5       # Max concurrent API calls per provider
