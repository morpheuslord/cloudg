# ─────────────────────────────────────────────────────────────────
# CloudG Configuration File
# ─────────────────────────────────────────────────────────────────
# Copy to config.yaml and customise for your environment.

# ── Providers ──
# Specify one or more providers to scan simultaneously.
# Options: aws, azure, gcp
providers:
  - aws
  # - azure  # Uncomment to scan Azure alongside AWS
  # - gcp    # Uncomment to scan GCP alongside AWS

# ── AWS ──
aws:
  regions:
    - us-east-1
    - eu-west-1
    # - ALL              # Uncomment to auto-discover and scan ALL enabled regions

  # Auth method 1: direct credentials (useful for third-party access)
  # Can also be set via env vars: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
  access_key_id: null      # Your AWS access key ID
  secret_access_key: null  # Your AWS secret access key
  session_token: null      # Optional: for temporary/STS credentials

  # Auth method 2: OIDC / web identity federation (GitHub Actions, EKS, GitLab CI)
  # Set role_arn together with web_identity_token_file.
  web_identity_token_file: null   # Path to the OIDC token file

  # Auth method 3: AWS CLI profile (plain or SSO)
  profile: null            # AWS CLI profile name (used if no direct keys)

  # Auth method 4: nothing at all — the default chain picks up env vars,
  # the EC2/ECS instance role (inherited role), or cached SSO credentials.

  # Role assumption (optional, layered on top of any method above)
  role_arn: null           # Full ARN of a role to assume via STS
  external_id: null        # ExternalId for the third-party auditor pattern
  role_session_name: cloudg-scan

  # Cross-account fan-out (optional)
  accounts: []             # Target account IDs (only if cross-account scanning)
  role_name: null          # IAM role to assume in each account

  max_retries: 10
  retry_mode: adaptive     # legacy | standard | adaptive

# ── Azure ──
azure:
  subscription_ids: []     # List of subscription IDs to scan
  tenant_id: null

  # Auth methods, tried in this order:
  # 1. Workload identity federation: tenant_id + client_id + federated_token_file
  # 2. Service principal secret:      tenant_id + client_id + client_secret
  # 3. Service principal certificate: tenant_id + client_id + certificate_path
  # 4. Managed identity:              use_managed_identity: true
  # 5. DefaultAzureCredential chain (env vars, Azure CLI, managed identity)
  client_id: null
  client_secret: null
  certificate_path: null
  federated_token_file: null # nosemgrep: codacy.yaml.security.hard-coded-tokens -- config key for a file path, no token value
  use_managed_identity: false
  managed_identity_client_id: null   # For user-assigned managed identities

  regions:
    - ALL                  # Auto-discover all Azure locations (default)
    # - eastus             # Or specify individual locations
    # - westeurope

# ── GCP ──
gcp:
  project_ids: []          # List of project IDs to scan
  organization_id: null

  # Auth methods, tried in this order:
  # 1. credentials_file: a service account key JSON, or a workload identity
  #    federation (external_account) config JSON
  # 2. Application default credentials (GOOGLE_APPLICATION_CREDENTIALS,
  #    gcloud user credentials, or the GCE/GKE metadata server)
  # impersonate_service_account layers impersonation on top of either.
  credentials_file: null
  impersonate_service_account: null  # e.g. scanner@my-project.iam.gserviceaccount.com

  regions:
    - ALL                  # Auto-discover all GCP regions (default)
    # - us-central1        # Or specify individual regions
    # - europe-west1

# ── Scanners ──
scanners:
  enabled:
    - prowler
    - scoutsuite
    - checkov
    - trivy
    - iam
  prowler_extra_args: []
  scoutsuite_extra_args: []
  checkov_extra_args: []
  checkov_frameworks: []     # Empty = auto-detect all frameworks (recommended)
    # Uncomment below to restrict to specific frameworks:
    # - terraform
    # - cloudformation
    # - arm
    # - kubernetes
  trivy_extra_args: []
  trivy_images: []
  iac_directories: []
  timeout_seconds: 3600

# ── Graph Engine ──
graph:
  persist_graphml: true
  max_nodes_warn: 10000
  compute_attack_paths: true
  export_cytoscape: false

# ── Ontology ──
ontology:
  enabled: true
  export_formats:
    - turtle
    - json-ld
  include_raw_metadata: false

# ── RAG Export ──
rag:
  enabled: true
  chunk_strategy: hybrid   # entity | community | relation_group | hybrid
  max_chunk_tokens: 2000 # nosemgrep: codacy.yaml.security.hard-coded-tokens -- LLM chunk size, not a token value

# ── Terraform Recreation ──
terraform:
  enabled: false
  output_dir: ./reports/terraform

# ── Reports ──
report:
  formats:
    - html
    - json
    - svg
  inline_js: true          # Bundle JS inline (no CDN) for air-gapped environments
  output_dir: ./reports

# ── External Rulesets ──
rulesets:
  # rules_dir: ./my-rules  # Override to use your own rulesets; by default the
  #                        # rulesets shipped inside the package are used
  load_external: true

# ── General ──
log_file: null             # null = console only; set path for file logging
verbose: false
concurrency_limit: 5       # Max concurrent API calls per provider
